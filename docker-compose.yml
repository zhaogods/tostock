services:
  instock_config_init:
    image: busybox:latest
    container_name: InStockConfigInit
    command: sh -c "mkdir -p /config && touch /config/instockproxy.txt /config/eastmoneycookie.txt"
    volumes:
      - ./data:/config

  instock:
    image: zsswwz/tostock:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: InStock
    ports:
      - "${WEB_PORT:-9988}:${WEB_PORT:-9988}"
    env_file:
      - .env
    environment:
      - db_host=${db_host:-InStockDbService}
      - db_port=${db_port:-3306}
      - db_user=${db_user:-root}
      - db_password=${db_password:-root}
      - db_database=${db_database:-test}
      - Tornado_COOKIE_SECRET=${Tornado_COOKIE_SECRET}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      - TUSHARE_DAILY_RATE=${TUSHARE_DAILY_RATE:-400}
      - TUSHARE_DAILY_BASIC_RATE=${TUSHARE_DAILY_BASIC_RATE:-150}
      - TUSHARE_MONEYFLOW_RATE=${TUSHARE_MONEYFLOW_RATE:-150}
      - TUSHARE_STOCK_BASIC_RATE=${TUSHARE_STOCK_BASIC_RATE:-40}
      - TUSHARE_FINA_INDICATOR_RATE=${TUSHARE_FINA_INDICATOR_RATE:-160}
      - TUSHARE_RATE_LIMIT=${TUSHARE_RATE_LIMIT:-180}
      - AGENT_LLM_ENABLED=${AGENT_LLM_ENABLED:-false}
      - AGENT_LLM_PROVIDER=${AGENT_LLM_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - AGENT_LLM_MODEL=${AGENT_LLM_MODEL:-claude-opus-4-8}
      - AGENT_LLM_MAX_TOKENS=${AGENT_LLM_MAX_TOKENS:-4096}
      - AGENT_LLM_TIMEOUT_SECONDS=${AGENT_LLM_TIMEOUT_SECONDS:-60}
      - SELECTION_REPORT_TOP_N=${SELECTION_REPORT_TOP_N:-20}
    volumes:
      - ./data/instockproxy.txt:/data/tostock/instock/config/proxy.txt
      - ./data/eastmoneycookie.txt:/data/tostock/instock/config/eastmoney_cookie.txt
      - ./data/cache/hist:/data/tostock/instock/cache/hist
      - ./data/cache/fina:/data/tostock/instock/cache/fina
      - ./data/reports:/data/tostock/reports
      - ./docker/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    depends_on:
      instock_config_init:
        condition: service_completed_successfully
    networks:
      - instock_network

networks:
  instock_network:
    driver: bridge